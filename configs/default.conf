# ═══════════════════════════════════════════════════════════════
# OTAUD Configuration File
# ═══════════════════════════════════════════════════════════════

[general]
version = 1.0.0
default_scan = full
default_output = html
verbose = false
threads = 10
timeout = 5

[network]
# OT-specific ports to scan
ot_ports = 20000,44818,102,502,1089,1090,1091,2222,2404,4000,4840,4843,4911,9600,18245,34962,34963,34964,34980,47808,55000,55001,55002,55003
# Common service ports
common_ports = 21,22,23,25,53,80,110,111,135,139,161,443,445,993,995,1433,1521,3306,3389,5432,5900,8080,8443
# IoT ports
iot_ports = 80,443,554,1883,5683,8080,8443,8883,4840,6668,9100,515,631

[protocols]
check_modbus = true
check_dnp3 = true
check_s7comm = true
check_ethernetip = true
check_opcua = true
check_bacnet = true
check_mqtt = true
check_coap = true
check_fins = true
check_hartip = true

[compliance]
default_standard = iec62443
# Available: iec62443, nist80082, nerccip, iso27001, all

[credentials]
# Enable/disable default credential testing
test_defaults = true
# Max attempts per service (to avoid lockouts)
max_attempts = 3

[reporting]
output_dir = ./reports
include_info = true
include_recommendations = true
